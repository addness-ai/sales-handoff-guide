<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Slide 09 — 営業マン手順書 — 面談からお渡しまで</title>
<style>
  :root { --bg: #fbfbfd; --bg-soft: #f5f5f7; --fg: #1d1d1f; --fg-muted: #6e6e73; --accent: #0071e3; --radius-card: 18px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; margin: 0; padding: 0; overflow: hidden; background: var(--bg); -webkit-font-smoothing: antialiased; }
  body { display: flex; align-items: center; justify-content: center; }
  .slide { position: relative; width: 1920px; height: 1080px; overflow: hidden; flex-shrink: 0; transform-origin: center center; transform: scale(min(calc(100vw / 1920px), calc(100vh / 1080px))); padding: 88px 140px 80px; display: flex; flex-direction: column; background: var(--bg); }
  .character-avatar { position: absolute; right: 40px; bottom: 72px; height: 432px; width: auto; object-fit: contain; z-index: 4; pointer-events: none; }
  .brand-logo { position: absolute; right: 60px; bottom: 32px; font-size: 18px; font-weight: 500; color: var(--fg-muted); letter-spacing: 0.04em; z-index: 5; }
  .footer { position: absolute; left: 60px; bottom: 32px; font-size: 18px; font-weight: 500; color: var(--fg-muted); }
  .slide .h1, .slide .title, .slide .sub, .slide .lead, .slide .desc, .slide .step-title, .slide .step-desc, .slide .closing-text, .slide .closing-note, .slide p, .slide .ph, .slide .pb, .slide .t, .slide .os, .slide .note, .slide .callout, .slide .cmdcap { word-break: keep-all; line-break: strict; overflow-wrap: break-word; }

  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Hiragino Sans', sans-serif; color: var(--fg); }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .tag { font-size: 23px; font-weight: 600; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 22px; }
  .phase { font-size: 23px; font-weight: 700; color: #fff; background: var(--accent); display: inline-block; padding: 8px 22px; border-radius: 9999px; margin-bottom: 22px; letter-spacing: 0.02em; }
  .h1 { font-size: 84px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; color: var(--fg); }
  .h1.sm { font-size: 64px; }
  .sub { font-size: 38px; font-weight: 400; color: var(--fg-muted); line-height: 1.5; margin-top: 36px; }
  .lead { font-size: 30px; font-weight: 400; color: var(--fg-muted); line-height: 1.55; margin-top: 22px; }
  .head { margin-bottom: 44px; }

  .steps4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; padding-right: 320px; }
  .card { background: var(--bg-soft); border-radius: var(--radius-card); padding: 36px 32px; display: flex; flex-direction: column; }
  .badge { width: 60px; height: 60px; border-radius: 9999px; background: var(--accent); color: #fff; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
  .card .title { font-size: 30px; font-weight: 600; color: var(--fg); line-height: 1.3; }
  .card .desc { font-size: 21px; font-weight: 400; color: var(--fg-muted); line-height: 1.55; margin-top: 12px; }

  .panel { background: var(--bg-soft); border-radius: var(--radius-card); padding: 42px 46px; margin-right: 320px; }
  .step { display: flex; gap: 16px; margin-top: 20px; align-items: baseline; }
  .step:first-of-type { margin-top: 0; }
  .step .n { color: var(--accent); font-weight: 700; font-size: 25px; flex: 0 0 auto; line-height: 1.45; }
  .step .t { font-size: 27px; color: var(--fg); line-height: 1.5; }
  .step .t b { font-weight: 600; color: var(--accent); }

  .cmd { background: #1d1d1f; color: #f5f5f7; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 30px; padding: 26px 32px; border-radius: 14px; margin-right: 320px; }
  .cmd .hl { color: #5ec8ff; font-weight: 600; }
  .cmdcap { font-size: 24px; color: var(--fg-muted); margin-top: 16px; }

  .callout { background: #eef6ff; border-radius: 14px; padding: 24px 30px; font-size: 25px; color: var(--fg); line-height: 1.5; margin-right: 320px; }
  .callout b { color: var(--accent); font-weight: 600; }

  .deliver { margin-right: 320px; display: flex; flex-direction: column; gap: 20px; }
  .drow { background: var(--bg-soft); border-radius: 14px; padding: 28px 34px; }
  .drow .dh { font-size: 28px; font-weight: 600; color: var(--fg); }
  .drow .du { font-size: 24px; color: var(--accent); margin-top: 8px; font-family: ui-monospace, monospace; }
  .drow .dn { font-size: 22px; color: var(--fg-muted); margin-top: 6px; }

  .points { display: flex; flex-direction: column; gap: 20px; margin-right: 320px; }
  .point { background: var(--bg-soft); border-radius: 14px; padding: 28px 34px; }
  .point .ph { font-size: 28px; font-weight: 600; color: var(--fg); }
  .point .pb { font-size: 22px; color: var(--fg-muted); margin-top: 8px; line-height: 1.5; }

  .note { font-size: 25px; color: var(--fg-muted); margin-top: 28px; line-height: 1.5; margin-right: 320px; }
  .closing-text { font-size: 78px; font-weight: 700; color: var(--fg); line-height: 1.22; letter-spacing: -0.02em; }
  .closing-note { font-size: 30px; color: var(--fg-muted); margin-top: 36px; line-height: 1.6; margin-right: 320px; }
  .main { padding-right: 320px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="head">
      <div class="tag">渡したあと</div>
      <h1 class="h1 sm">後片付けと、お客さんの動き</h1>
    </div>
    <div class="points">
      <div class="point"><div class="ph">手元のフォルダは削除してOK</div><div class="pb">クローンとzipは消して大丈夫。お客さんの会社はDriveとお客さんのPCにあります。PCの容量も軽くなります。</div></div>
      <div class="point"><div class="ph">お客さんがやること</div><div class="pb">まず導入スライドを見て Claude Code を準備 → つぎに会社zipを開いて「セットアップの続きをして」と話しかけるだけ。</div></div>
    </div>
    <img class="character-avatar" src="../assets/default.png" alt="" />
    <div class="brand-logo">AddNess</div>
    <div class="footer">slide 09 / 11</div>
  </div>
</body>
</html>
